name: Reason HCMO

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install reasoning dependencies
        run: pip install -r tooling/reasoning-requirements.txt
      - name: Run active HCMO HermiT check
        run: python tooling/reason.py --java-memory 2000
      - name: Regenerate the reasoner evaluation report (verify it is up to date)
        run: |
          pip install -r tooling/requirements.txt
          python tooling/evaluate.py --reason
          if ! git diff --quiet -- evaluation/reports/reasoner.md; then
            echo "::error::evaluation/reports/reasoner.md is stale. Run 'python tooling/evaluate.py --reason' and commit."
            git --no-pager diff -- evaluation/reports/reasoner.md
            exit 1
          fi
