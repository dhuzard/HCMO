# Cross-system competency questions for the HCMO multi-system evaluation.
# Executed over the canonical ontology plus every system graph listed in
# evaluation/multi-system.yaml. Expected answers are complete reviewed rows
# (unbound values as null); tooling/validate.py fails on any difference.
version: 0.3.0
dir: evaluation/queries
questions:
- id: ms-01-sensor-technologies
  question: Which sensor technologies monitor enclosures in each system, and how many enclosures does each technology cover?
  file: evaluation/queries/cq-ms-01-sensor-technologies-by-system.rq
  modules:
  - tech
  - core
  cross_system: true
  status: answered
  expected_answers:
  - system: https://w3id.org/hcmo/id/eval/fed3/
    technology: infrared photointerrupter
    enclosures: '1'
  - system: https://w3id.org/hcmo/id/eval/noldus-phenotyper/
    technology: infrared video
    enclosures: '2'
  - system: https://w3id.org/hcmo/id/eval/dvc-tecniplast/
    technology: capacitance (12-electrode array)
    enclosures: '24'
  - system: https://w3id.org/hcmo/id/eval/tse-phenomaster/
    technology: infrared light-beam interruption
    enclosures: '4'
  - system: https://w3id.org/hcmo/id/eval/tse-phenomaster/
    technology: load cell
    enclosures: '4'
  - system: https://w3id.org/hcmo/id/eval/tse-phenomaster/
    technology: paramagnetic O2 and infrared CO2 analysis
    enclosures: '4'
  - system: https://w3id.org/hcmo/id/eval/tse-phenomaster/
    technology: thermistor
    enclosures: '4'
- id: ms-02-housed-entities
  question: Per system, are animals housed as identifiable subjects or as cage-level groups, and how many holders and enclosures
    are assigned?
  file: evaluation/queries/cq-ms-02-housed-entities-by-system.rq
  modules:
  - bio
  - core
  cross_system: true
  status: answered
  note: DVC exports carry no animal identity, so its 24 cages are held by cage-level ExperimentalGroups; the three other systems
    yield individual Subjects.
  expected_answers:
  - system: https://w3id.org/hcmo/id/eval/fed3/
    holderType: https://w3id.org/hcmo/ontology/hcm/bio#Subject
    holders: '1'
    enclosures: '1'
  - system: https://w3id.org/hcmo/id/eval/noldus-phenotyper/
    holderType: https://w3id.org/hcmo/ontology/hcm/bio#Subject
    holders: '2'
    enclosures: '2'
  - system: https://w3id.org/hcmo/id/eval/dvc-tecniplast/
    holderType: https://w3id.org/hcmo/ontology/hcm/bio#ExperimentalGroup
    holders: '24'
    enclosures: '24'
  - system: https://w3id.org/hcmo/id/eval/tse-phenomaster/
    holderType: https://w3id.org/hcmo/ontology/hcm/bio#Subject
    holders: '4'
    enclosures: '4'
