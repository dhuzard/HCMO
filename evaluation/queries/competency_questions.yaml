    holder: https://w3id.org/hcmo/id/eval/fed3/mouse-1
    enrichmentType: nesting material
    darkObservations: '188'
  - system: https://w3id.org/hcmo/id/eval/noldus-phenotyper/
    holder: https://w3id.org/hcmo/id/eval/noldus-phenotyper/mouse-1
    enrichmentType: shelter
    darkObservations: '253'
  - system: https://w3id.org/hcmo/id/eval/noldus-phenotyper/
    holder: https://w3id.org/hcmo/id/eval/noldus-phenotyper/mouse-2
    enrichmentType: shelter
    darkObservations: '253'
  - system: https://w3id.org/hcmo/id/eval/tse-phenomaster/
    holder: https://w3id.org/hcmo/id/eval/tse-phenomaster/mouse-1
    enrichmentType: nesting material
    darkObservations: '36'
  - system: https://w3id.org/hcmo/id/eval/tse-phenomaster/
    holder: https://w3id.org/hcmo/id/eval/tse-phenomaster/mouse-2
    enrichmentType: nesting material
    darkObservations: '36'
