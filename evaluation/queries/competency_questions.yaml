  - bio
  - env
  - obs
  - core
  cross_system: true
  status: partial
  note: 'Answered for PhenoMaster, PhenoTyper and FED3 (7 holders). Not answerable for DVC: the real export states neither
    enrichment nor the light schedule, so no DVC row can qualify. The absence is a property of the export, not of the ontology.'
  expected_answers:
