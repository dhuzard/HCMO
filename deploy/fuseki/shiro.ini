# Apache Shiro security configuration for the HCMO public SPARQL endpoint.
#
# Based on the Fuseki 5.6.0 default (org/apache/jena/fuseki/server/shiro.ini in
# fuseki-server.jar). Copied to $FUSEKI_BASE/shiro.ini, where Fuseki picks it up
# instead of writing its default. Model: the UI and the (read-only) datasets are
# anonymous; the admin API is localhost-only. No user, no password.
# Shiro applies the FIRST matching [urls] rule, so the anonymous /$/ paths must
# stay above the /$/** rule.

[main]
# No TLS in the container; HTTPS is terminated by the platform (Clever Cloud).
ssl.enabled = false
# Filter that only lets requests from 127.0.0.1 / ::1 through.
localhostFilter = org.apache.jena.fuseki.authz.LocalhostFilter

[users]
# Intentionally empty: no account exists (the default ships user1=passwd1).

[roles]

[urls]
# Health check used by Docker, CI and the Clever Cloud health check.
/$/ping       = anon
# Server description; the UI reads it to list the datasets.
/$/server     = anon
# Per-dataset statistics, read by the UI "info" page.
/$/stats      = anon
/$/stats/**   = anon
# Prometheus metrics (read-only counters).
/$/metrics    = anon

# Everything else under /$/ (datasets, backup, compact, tasks, ...) is admin:
# reachable from inside the container only (e.g. docker exec ... curl localhost).
/$/** = localhostFilter

# UI pages and dataset endpoints (/hcmo/sparql, ...): anonymous. The datasets
# expose no write operation (see config.ttl), so anonymous means read-only.
/** = anon
