  "http://www.w3.org/ns/sosa/FeatureOfInterest": ["http://purl.obolibrary.org/obo/BFO_0000002"]
  "http://www.w3.org/ns/sosa/Procedure": ["http://purl.obolibrary.org/obo/BFO_0000031"]
  "https://w3id.org/hcmo/ontology/hcm/obs#BehaviorObservation": ["http://purl.obolibrary.org/obo/BFO_0000015"]
  "https://w3id.org/hcmo/ontology/hcm/obs#WeightObservation": ["http://purl.obolibrary.org/obo/BFO_0000015"]
